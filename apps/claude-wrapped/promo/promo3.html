<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Компромат — промо v3</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&family=Onest:wght@500;700&family=JetBrains+Mono:wght@600&display=swap">
<style>html,body{margin:0;background:#000}canvas{display:block;width:360px;height:640px}</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
/* «Компромат» promo v2 — real stats of @leonario23, 28 s, 1080x1920.
   render(t) is deterministic: every frame can be drawn on its own (used by render.js). */
const W = 1080, H = 1920, DUR = 30;  // timed to voice.mp3 at 1.2x
const C = { ink: "#12101a", ink2: "#1d1a28", paper: "#f3efe6", cobalt: "#2f3fe3", orange: "#ff7a1a", mint: "#bff0d4", plum: "#3b1540", lemon: "#f2e94e", rose: "#ff5f7e", cyan: "#4de1ff" };
const PAL = [C.cobalt, C.orange, C.mint, C.lemon, C.rose, C.paper];
const D = '"Unbounded", sans-serif', B = '"Onest", sans-serif', M = '"JetBrains Mono", monospace';
const HANDLE = "@leonario23";
const cv = document.getElementById("c"), x = cv.getContext("2d");

/* ---------- math ---------- */
const clamp = (v) => Math.max(0, Math.min(1, v));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, p) => a + (b - a) * p;
const oCubic = (p) => 1 - Math.pow(1 - p, 3);
const ioCubic = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
const oExpo = (p) => (p >= 1 ? 1 : 1 - Math.pow(2, -10 * p));
const iExpo = (p) => (p <= 0 ? 0 : Math.pow(2, 10 * p - 10));
const oBack = (p, c = 1.7) => 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2);
const oElastic = (p) => (p <= 0 ? 0 : p >= 1 ? 1 : Math.pow(2, -10 * p) * Math.sin((p * 10 - 0.75) * (2 * Math.PI / 3)) + 1);
function rng(seed) { return () => { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let r = Math.imul(seed ^ (seed >>> 15), 1 | seed); r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r; return ((r ^ (r >>> 14)) >>> 0) / 4294967296; }; }
const fmt = (n) => Math.round(n).toLocaleString("ru-RU").replace(/ /g, " ");
function mix(c1, c2, p) { const a = parseInt(c1.slice(1), 16), b = parseInt(c2.slice(1), 16); const r = Math.round(lerp(a >> 16, b >> 16, p)), g = Math.round(lerp((a >> 8) & 255, (b >> 8) & 255, p)), bl = Math.round(lerp(a & 255, b & 255, p)); return `rgb(${r},${g},${bl})`; }

/* ---------- text ---------- */
function font(size, weight, fam) { x.font = `${weight} ${size}px ${fam}`; }
function fit(str, size, weight, fam, maxW) { font(size, weight, fam); while (x.measureText(str).width > maxW && size > 18) { size -= 3; font(size, weight, fam); } return size; }
function txt(str, px, py, o = {}) {
  const size = fit(str, o.size || 80, o.w || 900, o.f || D, o.maxW || W - 140);
  x.save(); x.globalAlpha *= o.a == null ? 1 : o.a; x.textAlign = o.align || "left"; x.textBaseline = "alphabetic";
  if (o.ls) x.letterSpacing = o.ls + "px";
  x.translate(px, py); if (o.rot) x.rotate(o.rot); if (o.s != null) x.scale(o.s, o.s);
  if (o.glow) { x.shadowColor = o.glow; x.shadowBlur = o.glowR || 40; }
  if (o.stroke) { x.lineJoin = "round"; x.lineWidth = o.strokeW || 12; x.strokeStyle = o.stroke; x.strokeText(str, 0, 0); }
  if (o.chroma) { const k = o.chroma; x.globalAlpha *= 0.85; x.fillStyle = C.rose; x.fillText(str, -k, 0); x.fillStyle = C.cyan; x.fillText(str, k, 0); x.globalAlpha /= 0.85; }
  x.fillStyle = o.c || C.paper; x.fillText(str, 0, 0); x.restore(); return size;
}
function rise(str, px, py, t, at, o = {}) {
  const p = oCubic(prog(t, at, at + 0.45)); if (p <= 0) return;
  const size = o.size || 80;
  x.save(); x.beginPath(); x.rect(-100, py - size * 1.1, W + 200, size * 1.45); x.clip();
  txt(str, px, py + (1 - p) * size * 1.25, o); x.restore();
}
function slam(str, px, py, t, at, o = {}) {
  const p = prog(t, at, at + 0.2); if (p <= 0) return;
  const k = 1 - oCubic(p);
  for (let g = 3; g >= 1 && k > 0.05; g--) txt(str, px, py, { ...o, s: 1 + k * (o.from || 1.2) * (1 + g * 0.18), a: 0.12 * k });   // motion blur ghosts
  txt(str, px, py, { ...o, s: 1 + k * (o.from || 1.2), a: Math.min(1, p * 2), chroma: (o.chroma || 0) + k * 26 });
}
function typewriter(str, px, py, t, at, cps, o = {}) {
  const n = Math.floor(Math.max(0, t - at) * cps); if (n <= 0) return;
  const shown = str.slice(0, n), caret = n < str.length && Math.floor(t * 6) % 2 === 0 ? "▌" : "";
  txt(shown + caret, px, py, o);
}
// slot-machine digits: each column spins and lands left to right
function slot(value, px, py, size, t, at, dur, o = {}) {
  const s = fmt(value); font(size, 900, D);
  let total = 0; for (const ch of s) total += x.measureText(ch === " " ? " " : ch).width;
  let cx = o.align === "center" ? px - total / 2 : px; let col = 0; const nCols = s.replace(/ /g, "").length;
  for (const ch of s) {
    font(size, 900, D); const w = x.measureText(ch).width;
    if (ch === " ") { cx += w; continue; }
    const d = +ch, land = at + dur * (0.35 + 0.65 * (col / Math.max(1, nCols - 1))), p = prog(t, at, land);
    if (t >= at) {
      const spins = 2 + (nCols - col), pos = (1 - oCubic(p)) * spins * 10, cur = Math.floor(pos) % 10, frac = pos - Math.floor(pos);
      x.save(); x.beginPath(); x.rect(cx - 4, py - size * 0.86, w + 8, size * 1.0); x.clip();
      x.fillStyle = o.c || C.paper;
      const dA = (d + cur) % 10, dB = (d + cur + 1) % 10;
      if (p >= 1) x.fillText(String(d), cx, py);
      else { x.globalAlpha = 0.9; x.fillText(String(dA), cx, py - frac * size * 0.95); x.fillText(String(dB), cx, py + (1 - frac) * size * 0.95); }
      x.restore();
    }
    cx += w; col++;
  }
}

/* ---------- post effects ---------- */
const grains = [0, 1, 2, 3].map((k) => { const g = document.createElement("canvas"); g.width = 270; g.height = 480; const gx = g.getContext("2d"), r = rng(100 + k), im = gx.createImageData(270, 480); for (let i = 0; i < im.data.length; i += 4) { const v = r() * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; } gx.putImageData(im, 0, 0); return g; });
function post(t) {
  x.save(); x.globalAlpha = 0.07; x.globalCompositeOperation = "overlay"; x.imageSmoothingEnabled = false;
  x.drawImage(grains[Math.floor(t * 24) % 4], 0, 0, W, H); x.restore();
  const v = x.createRadialGradient(W / 2, H / 2, H * 0.32, W / 2, H / 2, H * 0.75); v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(1, "rgba(0,0,0,0.42)");
  x.fillStyle = v; x.fillRect(0, 0, W, H);
  for (const f of FLASHES) { const d = t - f; if (d >= 0 && d < 0.3) { x.fillStyle = `rgba(255,255,255,${0.85 * (1 - d / 0.3)})`; x.fillRect(0, 0, W, H); } }
}
const IMPACTS = [1.48, 3.5, 11.5, 17.85, 20.0, 25.3, 28.6];
const FLASHES = [1.3, 11.5, 20.0];
function shake(t) {
  let dx = 0, dy = 0, r = 0;
  for (const i of IMPACTS) { const d = t - i; if (d >= 0 && d < 0.55) { const a = 30 * Math.exp(-d * 8); dx += Math.sin(d * 95) * a; dy += Math.cos(d * 73) * a * 0.7; r += Math.sin(d * 60) * a * 0.0006; } }
  return [dx, dy, r];
}
// horizontal slice glitch of what is already drawn
function glitch(t, strength, seed) {
  if (strength <= 0) return;
  const r = rng(seed + Math.floor(t * 30));
  for (let i = 0; i < 9; i++) { const y = r() * H, h = 20 + r() * 120, off = (r() - 0.5) * 160 * strength; x.drawImage(cv, 0, y, W, h, off, y, W, h); }
  x.save(); x.globalAlpha = 0.25 * strength; x.fillStyle = r() > 0.5 ? C.cyan : C.rose; x.fillRect(0, r() * H, W, 6 + r() * 20); x.restore();
}

/* ---------- particles ---------- */
function confettiRain(t, at, seed, n) {
  const r = rng(seed), tau = t - at; if (tau < 0) return;
  for (let i = 0; i < n; i++) {
    const x0 = r() * W, delay = r() * 1.4, v = 520 + r() * 700, w = 14 + r() * 14, h = 22 + r() * 18, spin = (r() - 0.5) * 10, sway = 30 + r() * 60;
    const tt = tau - delay; if (tt < 0) continue;
    const py = -60 + v * tt, px = x0 + Math.sin(tt * 3 + i) * sway; if (py > H + 60) continue;
    x.save(); x.translate(px, py); x.rotate(spin * tt + i); x.fillStyle = PAL[i % PAL.length]; x.fillRect(-w / 2, -h / 2, w, h * Math.abs(Math.cos(spin * tt + i)) + 2); x.restore();
  }
}
function dust(t, at, cx, cy, n, color, seed, spread = 1) {
  const r = rng(seed), d = t - at; if (d < 0 || d > 1.1) return;
  x.save(); x.fillStyle = color;
  for (let i = 0; i < n; i++) { const a = r() * 6.283, sp = (400 + r() * 900) * spread, sz = 5 + r() * 12; x.globalAlpha = Math.max(0, 1 - d / 1.1); x.fillRect(cx + Math.cos(a) * sp * oCubic(Math.min(1, d * 1.4)), cy + Math.sin(a) * sp * 0.6 * oCubic(Math.min(1, d * 1.4)) + 300 * d * d, sz, sz); }
  x.restore();
}
function lightLeak(t, color, seed) {
  const r = rng(seed); x.save(); x.globalCompositeOperation = "screen";
  for (let i = 0; i < 2; i++) { const cx = W * (0.2 + 0.6 * r()) + Math.sin(t * 0.7 + i * 2) * 220, cy = H * (0.2 + 0.6 * r()) + Math.cos(t * 0.5 + i) * 300, g = x.createRadialGradient(cx, cy, 0, cx, cy, 700); g.addColorStop(0, color); g.addColorStop(1, "rgba(0,0,0,0)"); x.globalAlpha = 0.22; x.fillStyle = g; x.fillRect(0, 0, W, H); }
  x.restore();
}
function rr(px, py, w, h, rad) { x.beginPath(); x.roundRect(px, py, w, h, rad); }

/* ---------- v3 effects ---------- */
const GLYPHS = "█▓▒░#@%&$!?<>/\\АБВГДЖЗКЛМНПРСТФХЦЧШЯ0123456789";
// decode effect: unresolved letters flicker as random glyphs
function scr(str, t, at, dur) {
  const p = prog(t, at, at + dur); if (p >= 1) return str; const r = rng(Math.floor(t * 30) + str.length * 7);
  return [...str].map((c, i) => (c === " " || i / str.length < p ? c : GLYPHS[Math.floor(r() * GLYPHS.length)])).join("");
}
// police tape across the frame
function tape(t, at, dur, ang, cy, bg, fg, text) {
  const p = prog(t, at, at + dur); if (p <= 0 || p >= 1) return;
  const inP = oExpo(prog(t, at, at + 0.15)), outP = iExpo(prog(t, at + dur - 0.15, at + dur));
  x.save(); x.translate(W / 2 + (outP - (1 - inP)) * 1800 * Math.sign(ang || 1), cy); x.rotate(ang);
  x.fillStyle = bg; x.fillRect(-1400, -62, 2800, 124);
  x.fillStyle = fg; x.fillRect(-1400, -62, 2800, 8); x.fillRect(-1400, 54, 2800, 8);
  font(56, 900, D); const unit = text + "  ✕  ", uw = x.measureText(unit).width, off = ((t - at) * 900) % uw;
  for (let k = -1400 - off; k < 1400; k += uw) x.fillText(unit, k, 20);
  x.restore();
}
// huge outlined words scrolling behind a scene
function marquee(t, cy, text, size, speed, color, alpha) {
  x.save(); x.globalAlpha = alpha; x.strokeStyle = color; x.lineWidth = 4; font(size, 900, D);
  const unit = text + " ", uw = x.measureText(unit).width, off = ((t * speed) % uw + uw) % uw;
  for (let k = -off - uw; k < W + uw; k += uw) x.strokeText(unit, k, cy);
  x.restore();
}
// black censor bar that rips away at `at`
function redact(t, at, rx, ry, rw, rh, seed) {
  const p = oExpo(prog(t, at, at + 0.22)); if (p >= 1 && t - at > 0.8) return;
  if (p < 1) {
    const left = rx + rw * p; x.save(); x.fillStyle = "#050409"; x.beginPath(); x.moveTo(left, ry);
    const r = rng(seed); for (let k = 0; k <= 10; k++) x.lineTo(left + (k % 2 ? 18 : 0) * (p > 0 ? 1 : 0), ry + rh * k / 10);
    x.lineTo(rx + rw, ry + rh); x.lineTo(rx + rw, ry); x.closePath(); x.fill();
    if (p === 0) { x.fillStyle = C.rose; font(26, 600, M); x.letterSpacing = "6px"; x.fillText("ЗАСЕКРЕЧЕНО", rx + 24, ry + rh - 22); x.letterSpacing = "0px"; x.strokeStyle = C.rose; x.lineWidth = 3; x.strokeRect(rx + 10, ry + 10, rw - 20, rh - 20); }
    x.restore();
  }
  const d = t - at; if (d > 0 && d < 0.8) { const r = rng(seed + 1); x.save(); x.fillStyle = C.lemon; for (let i = 0; i < 30; i++) { const a = -0.5 + r() * 1.0, sp = 500 + r() * 900, px = rx + rw * Math.min(1, p) , py = ry + r() * rh; x.globalAlpha = 1 - d / 0.8; x.fillRect(px + Math.cos(a) * sp * d, py + Math.sin(a) * sp * d + 400 * d * d, 6, 6); } x.restore(); }
}
// pixel drag / datamosh on impacts
function pixelDrag(t, strength, seed) {
  if (strength <= 0) return; const r = rng(seed + Math.floor(t * 24));
  for (let i = 0; i < 26; i++) { const w = 6 + r() * 40, sx = r() * W, y0 = r() * H * 0.8, h = 40 + r() * 300, drag = (60 + r() * 500) * strength; x.drawImage(cv, sx, y0, w, h, sx, y0 + drag * 0.2, w, h + drag); }
}
function speedLines(p) {
  if (p <= 0 || p >= 1) return; const r = rng(42); x.save(); x.strokeStyle = C.paper; x.globalAlpha = Math.sin(p * Math.PI) * 0.6;
  for (let i = 0; i < 70; i++) { const a = r() * 6.283, r0 = 120 + r() * 300 + p * 600, len = 200 + r() * 700; x.lineWidth = 2 + r() * 5; x.beginPath(); x.moveTo(W / 2 + Math.cos(a) * r0, H / 2 + Math.sin(a) * r0); x.lineTo(W / 2 + Math.cos(a) * (r0 + len), H / 2 + Math.sin(a) * (r0 + len)); x.stroke(); }
  x.restore();
}
const REDACT = [ // [scene index, abs reveal time, x, y, w, h]
  [1, 3.68, 50, 330, 560, 420], [2, 7.15, 40, 470, 1000, 300], [3, 12.55, 240, 900, 600, 140], [4, 16.15, W / 2 - 340, 1140, 680, 180], [6, 24.1, W / 2 - 400, 640, 800, 220],
];
const TAPES = [3.5, 7.0, 14.85, 23.25, 25.3];

/* ---------- kinetic subtitles ---------- */
const SUBS = [
  { a: 0.1, b: 3.4, text: "Весь компромат, который ИИ собрал на меня", hi: ["компромат,", "ИИ"] },
  { a: 3.63, b: 5.05, text: "73 чата.", hi: ["73"] },
  { a: 5.12, b: 6.95, text: "2 585 сообщений.", hi: [] },
  { a: 7.09, b: 8.45, text: "200 586 слов —", hi: ["200 586"], st: 0.25 },
  { a: 8.5, b: 11.4, text: "два с половиной романа лично мне", hi: ["романа"], st: 0.22 },
  { a: 11.68, b: 13.1, text: "Мой пиковый час — полночь.", hi: ["полночь."], st: 0.2 },
  { a: 13.19, b: 14.8, text: "Официально: ночная сова", hi: ["сова"], st: 0.3 },
  { a: 14.88, b: 17.8, text: "Самый длинный чат — 321 сообщение", hi: ["321"], st: 0.22 },
  { a: 17.91, b: 19.95, text: "Про… массажёр", hi: ["массажёр"], st: 0.65 },
  { a: 20.17, b: 23.15, text: "Секретные достижения, которые есть не у всех", hi: ["Секретные"], st: 0.3 },
  { a: 23.31, b: 24.58, text: "Мой тип — Инженер.", hi: ["Инженер."], st: 0.25 },
  { a: 24.64, b: 25.28, text: "А ты какой?", hi: ["ты"], st: 0.15 },
];
function subtitles(t) {
  const s = SUBS.find((q) => t >= q.a && t < q.b); if (!s) return;
  const words = s.text.replace("200 586", "200 586").split(" "), size = 60, gap = 18, maxW = W - 160;
  font(size, 900, D);
  const lines = []; let line = [], lw = 0;
  for (const w of words) { const ww = x.measureText(w).width; if (lw + ww > maxW && line.length) { lines.push([line, lw - gap]); line = []; lw = 0; } line.push([w, ww]); lw += ww + gap; }
  lines.push([line, lw - gap]);
  const out = prog(t, s.b - 0.18, s.b); let k = 0;
  lines.forEach(([ln, width], li) => {
    let cx = W / 2 - width / 2; const cy = 1430 + li * 78 - (lines.length - 1) * 39;
    for (const [w, ww] of ln) {
      const st = s.st || 0.09, p = prog(t, s.a + k * st, s.a + k * st + 0.22), isHi = s.hi.includes(w.replace(" ", " ")) || s.hi.includes(w);
      if (p > 0) {
        const sc = oBack(p, 2.4) * (1 - out * 0.3);
        x.save(); x.translate(cx + ww / 2, cy); x.scale(sc, sc); x.rotate((1 - p) * 0.2); x.globalAlpha = Math.min(1, p * 2) * (1 - out);
        x.textAlign = "center"; font(size, 900, D); x.lineJoin = "round";
        const shown = p < 1 ? scr(w, t, s.a + k * st, 0.2) : w; x.lineWidth = 14; x.strokeStyle = C.ink; x.strokeText(shown, 0, 0); x.fillStyle = isHi ? C.orange : C.paper; x.fillText(shown, 0, 0); x.restore();
      }
      cx += ww + gap; k++;
    }
  });
}

/* ---------- scenes ---------- */
const SCENES = [];
function scene(start, dur, trans, draw) { SCENES.push({ start, dur, trans, draw }); }

// 0. Boot + stamp
scene(0, 3.5, null, (t) => {
  x.fillStyle = C.ink; x.fillRect(-80, -80, W + 160, H + 160);
  const r = rng(5); x.save(); x.font = `600 26px ${M}`; x.fillStyle = C.mint;
  for (let i = 0; i < 46; i++) { const y = ((i * 44 - t * 900) % (H + 80) + H + 80) % (H + 80); x.globalAlpha = 0.06 + r() * 0.08; let s = ""; for (let k = 0; k < 34; k++) s += "0123456789abcdef{}[]:\"/ "[Math.floor(r() * 24)]; x.fillText(s, 40, y); }
  x.restore();
  if (t < 1.3) {
    typewriter("> загружаю твои чаты…", 120, 820, t, 0.05, 40, { size: 44, w: 600, f: M, c: C.mint, maxW: 900 });
    const p = ioCubic(prog(t, 0.15, 1.15)); x.fillStyle = "#2e2a3d"; rr(120, 880, 840, 26, 13); x.fill(); x.fillStyle = C.mint; rr(120, 880, Math.max(26, 840 * p), 26, 13); x.fill();
    txt(Math.round(p * 100) + "%", 960, 970, { size: 40, w: 600, f: M, c: C.mint, align: "right" });
    txt("73 чата · 2 585 сообщений · 18.07 — 31.10.2026", 120, 970, { size: 26, w: 600, f: M, c: "#a39db3", a: prog(t, 0.6, 0.8), maxW: 640 });
  }
  const p = prog(t, 1.3, 1.48);
  if (p > 0) {
    const k = 1 - oCubic(p), sc = 1 + k * 3.5;
    for (let g = 0; g < 4 && k > 0.02; g++) { x.save(); x.translate(W / 2, 900); x.rotate(-0.12); x.scale(sc * (1 + g * 0.15), sc * (1 + g * 0.15)); x.globalAlpha = 0.1; stampShape(C.orange); x.restore(); }
    x.save(); x.translate(W / 2, 900); x.rotate(-0.12); x.scale(sc, sc); x.globalAlpha = Math.min(1, p * 2); stampShape(C.orange, t > 1.48 ? 0 : 20); x.restore();
    if (t > 1.48) { // cracks
      const r2 = rng(77), d = prog(t, 1.48, 1.7); x.save(); x.strokeStyle = C.orange; x.lineWidth = 4; x.globalAlpha = 0.6;
      for (let i = 0; i < 14; i++) { let a = r2() * 6.283, px = W / 2 + Math.cos(a) * 470, py = 900 + Math.sin(a) * 170; x.beginPath(); x.moveTo(px, py); const n = 5; for (let s = 1; s <= n * d; s++) { a += (r2() - 0.5) * 0.9; px += Math.cos(a) * 60; py += Math.sin(a) * 60; x.lineTo(px, py); } x.stroke(); }
      x.restore();
    }
    dust(t, 1.48, W / 2, 900, 70, C.orange, 11);
  }
  rise("ДЕЛО № 2026", W / 2, 1150, t, 1.8, { size: 44, w: 600, f: M, c: C.paper, align: "center", ls: 8 });
  rise(HANDLE.toUpperCase(), W / 2, 1220, t, 1.95, { size: 40, w: 600, f: M, c: C.orange, align: "center", ls: 6 });
  if (t > 1.0 && t < 1.32) glitch(t, prog(t, 1.0, 1.3), 3);
});
function stampShape(color, extra = 0) {
