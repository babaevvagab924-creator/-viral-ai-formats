<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Компромат — промо v6 «Начальник полиции»</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&family=Onest:wght@500;700&family=JetBrains+Mono:wght@600&family=PT+Mono&display=swap">
<style>html,body{margin:0;background:#000}#out{display:block;width:360px;height:640px}#c{display:none}</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<canvas id="out" width="1080" height="1920"></canvas>
<script>window.SKIP_SUBS = true; window.EMBEDDED = true;</script>
<script src="promo3.js"></script>
<script src="voice_env.js"></script>
<script>
(() => {
/* «Компромат» v6: pixel Claude as police chief walks through seven Blender-rendered locations.
   Character = rigged 2D parts (body, arms, legs) rendered in Blender; render6(t) is deterministic (60 fps export). */
const W = 1080, H = 1920, DUR = 30;
const out = document.getElementById("out"), x = out.getContext("2d");
const C = { ink: "#07060a", paper: "#e6dcc6", red: "#e8322b", amber: "#ffb35c", orange: "#ff7a1a", gold: "#e0a83a" };
const M = '"PT Mono", "JetBrains Mono", monospace', D = '"Unbounded", sans-serif';
const clamp = (v) => Math.max(0, Math.min(1, v)), prog = (t, a, b) => clamp((t - a) / (b - a)), lerp = (a, b, p) => a + (b - a) * p;
const oC = (p) => 1 - Math.pow(1 - p, 3), io = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
const oB = (p, k = 1.7) => 1 + (k + 1) * Math.pow(p - 1, 3) + k * Math.pow(p - 1, 2);
function rng(s) { return () => { s |= 0; s = (s + 0x6D2B79F5) | 0; let r = Math.imul(s ^ (s >>> 15), 1 | s); r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r; return ((r ^ (r >>> 14)) >>> 0) / 4294967296; }; }
const fmt = (n) => Math.round(n).toLocaleString("ru-RU").replace(/ /g, " ");
function env(t) { const E = window.VOICE_ENV || [], f = t * 30, i = Math.floor(f); return lerp(E[i] || 0, E[i + 1] || 0, f - i); }
const wave = (t, f, a = 1) => Math.sin(t * f * 6.283) * a;

/* ---------- assets ---------- */
const IMG = {}, LOC = {}; let RIG = null;
const img = (key, src) => new Promise((r) => { const im = new Image(); im.onload = () => { IMG[key] = im; r(); }; im.onerror = () => r(); im.src = src; });
const LOCS = ["office", "archive", "roof", "vault", "mugshot", "prison"];
window.ready6 = Promise.all([
  ...["body", "armL", "armR", "leg2", "leg4", "leg7", "leg9"].map((n) => img(n, `chief/chief_${n}.png`)),
  ...LOCS.map((n) => img(n, `chief_loc/${n}.png`)), img("prison_fg", "chief_loc/prison_fg.png"), img("interrogation", "noir/bg.png"),
  fetch("chief/chief_meta.json").then((r) => r.json()).then((m) => (RIG = m)),
  ...LOCS.map((n) => fetch(`chief_loc/${n}.json`).then((r) => r.json()).then((m) => (LOC[n] = m))),
  fetch("noir/layers_meta.json").then((r) => r.json()).then((m) => (LOC.interrogation = { feet: m.char_feet, height_px: (m.char_feet[1] - m.char_top[1]) * 0.75 / 0.6 })),
  window.ready, document.fonts.load('400 40px "PT Mono"', "Дело 0123"), document.fonts.load('900 40px "Unbounded"', "КОМПРОМАТ"),
]);

/* ---------- text / props ---------- */
function T(str, px, py, o = {}) {
  x.save(); x.globalAlpha *= o.a == null ? 1 : o.a; x.font = `${o.w || 400} ${o.size || 48}px ${o.f || M}`; x.textAlign = o.align || "left";
  if (o.ls) x.letterSpacing = o.ls + "px"; x.translate(px, py); if (o.rot) x.rotate(o.rot); if (o.s) x.scale(o.s, o.s);
  if (o.glow) { x.shadowColor = o.glow; x.shadowBlur = o.glowR || 30; }
  if (o.stroke) { x.lineWidth = o.strokeW || 10; x.strokeStyle = o.stroke; x.lineJoin = "round"; x.strokeText(str, 0, 0); }
  x.fillStyle = o.c || C.paper; x.fillText(str, 0, 0); x.restore();
}
const typed = (str, t, at, cps) => { const n = Math.floor(Math.max(0, t - at) * cps); return str.slice(0, n) + (n < str.length && n > 0 && Math.floor(t * 8) % 2 ? "▌" : ""); };
const counter = (v, t, at, dur) => Math.round(v * oC(prog(t, at, at + dur)));
function stamp(text, cx, cy, t, at, size = 100, rot = -0.08, color = C.red) {
  const p = prog(t, at, at + 0.16); if (p <= 0) return;
  const s = 1 + (1 - oC(p)) * 2.2; x.save(); x.translate(cx, cy); x.rotate(rot); x.scale(s, s); x.globalAlpha = Math.min(1, p * 1.5) * 0.93;
  x.font = `900 ${size}px ${D}`; const w = x.measureText(text).width; x.strokeStyle = color; x.lineWidth = size * 0.09;
  x.beginPath(); x.roundRect(-w / 2 - size * 0.35, -size * 0.85, w + size * 0.7, size * 1.2, size * 0.18); x.stroke();
  x.fillStyle = color; x.textAlign = "center"; x.fillText(text, 0, size * 0.12);
  x.globalCompositeOperation = "destination-out"; const r = rng(text.length * 31); for (let i = 0; i < 220; i++) { x.globalAlpha = 0.5 * r(); x.fillRect((r() - 0.5) * (w + size), (r() - 0.6) * size * 1.2, 3 + r() * 7, 2 + r() * 4); }
  x.restore();
}
function paper(cx, cy, w, h, rot, t, at, draw) {
  const p = prog(t, at, at + 0.35); if (p <= 0) return; const e = oB(p, 1.2);
  x.save(); x.translate(cx, lerp(cy - 900, cy, e)); x.rotate(rot + (1 - p) * 0.6); x.shadowColor = "rgba(0,0,0,.6)"; x.shadowBlur = 30; x.shadowOffsetY = 14;
  x.fillStyle = C.paper; x.fillRect(-w / 2, -h / 2, w, h); x.shadowColor = "transparent"; x.fillStyle = "rgba(120,90,60,.18)"; x.fillRect(-w / 2, -h / 2, w, 10); draw(w, h); x.restore();
}

/* ---------- the chief: rigged parts ---------- */
const rigC = document.createElement("canvas"); rigC.width = 1080; rigC.height = 1080; const rx = rigC.getContext("2d");
function drawChief(pose, tint) {
  rx.setTransform(1, 0, 0, 1, 0, 0); rx.clearRect(0, 0, 1080, 1080);
  const c = RIG.cell_px, feet = RIG.feet;
  rx.save(); rx.translate(feet[0], feet[1]); rx.rotate(pose.lean || 0); rx.scale((pose.turn || 1) / Math.sqrt(pose.squash || 1), pose.squash || 1); rx.translate(-feet[0], -feet[1] - (pose.hop || 0));
  for (const n of ["2", "4", "7", "9"]) { const lift = (pose.legs && pose.legs[n]) || 0; rx.drawImage(IMG["leg" + n], 0, -lift); }
  rx.save(); rx.translate(0, -(pose.bob || 0));
  rx.drawImage(IMG.body, 0, 0);
  // face: eyes + pixel mouth on the front plane
  const [mx, my] = RIG.mouth, o = clamp(pose.mouth || 0);
  if (pose.surprised) { for (const [ex, ey] of RIG.eyes) { rx.fillStyle = "#050405"; rx.fillRect(ex - c * 0.68, ey - c * 0.75, c * 1.36, c * 1.4); } }
  else if (pose.blink) { for (const [ex, ey] of RIG.eyes) { rx.fillStyle = "#df9478"; rx.fillRect(ex - c * 0.52, ey - c * 0.52, c * 1.04, c * 1.04); rx.fillStyle = "#050405"; rx.fillRect(ex - c * 0.5, ey - 4, c, 9); } }
  const mw = c * (1.4 + 0.4 * o), mh = c * (0.2 + 0.58 * o); rx.fillStyle = "#050405"; rx.fillRect(mx - mw / 2, my - mh / 2, mw, mh);
  for (const [n, piv, ang] of [["armL", RIG.pivot_armL, pose.armL || 0], ["armR", RIG.pivot_armR, pose.armR || 0]]) { rx.save(); rx.translate(piv[0], piv[1]); rx.rotate(ang); rx.translate(-piv[0], -piv[1]); rx.drawImage(IMG[n], 0, 0); rx.restore(); }
  rx.restore(); rx.restore();
  if (tint) { rx.save(); rx.globalCompositeOperation = "source-atop"; rx.fillStyle = tint; rx.fillRect(0, 0, 1080, 1080); rx.restore(); }
  return rigC;
}
function placeChief(loc, pose, tint, dx = 0) {
  const L = LOC[loc], s = L.height_px / 675 * (pose.scale || 1), fx = L.feet[0] + dx, fy = L.feet[1];
  x.save(); const g = x.createRadialGradient(fx, fy, 0, fx, fy, 260 * s); g.addColorStop(0, "rgba(0,0,0,.55)"); g.addColorStop(1, "rgba(0,0,0,0)");
  x.translate(fx, fy); x.scale(1, 0.22); x.fillStyle = g; x.beginPath(); x.arc(0, 0, 260 * s * (1 - clamp((pose.hop || 0) / 300) * 0.5), 0, 6.283); x.fill(); x.restore();
  const im = drawChief(pose, tint); x.save(); x.translate(fx, fy); x.scale(s, s); x.drawImage(im, -RIG.feet[0], -RIG.feet[1]); x.restore();
}
function basePose(t) {
  const e = env(t); return { mouth: e, bob: Math.abs(wave(t, 3.2)) * 8 * e, squash: 1 + 0.03 * e * wave(t, 6), blink: (t % 3.3) > 3.18, armL: 0.08 * wave(t, 0.7), armR: -0.08 * wave(t, 0.8) };
}
const walkLegs = (t, amp) => ({ "2": Math.max(0, wave(t, 3)) * amp, "7": Math.max(0, wave(t, 3)) * amp, "4": Math.max(0, -wave(t, 3)) * amp, "9": Math.max(0, -wave(t, 3)) * amp });

/* ---------- scenes ---------- */
const SCENES = [
  { a: 0.0, b: 7.0, loc: "office", tint: "rgba(255,170,90,.10)" },
  { a: 7.0, b: 11.5, loc: "archive", tint: "rgba(255,190,120,.12)" },
  { a: 11.5, b: 14.85, loc: "roof", tint: "rgba(90,110,255,.22)" },
  { a: 14.85, b: 20.0, loc: "interrogation", tint: "rgba(255,80,40,.18)" },
  { a: 20.0, b: 23.25, loc: "vault", tint: "rgba(255,180,60,.14)" },
  { a: 23.25, b: 25.3, loc: "mugshot", tint: "rgba(200,220,255,.06)" },
  { a: 25.3, b: 30.0, loc: "prison", tint: "rgba(160,200,255,.12)" },
];
function chiefPose(t) {
  const p = basePose(t);
  if (t < 3.5) {                                  // office: salute while introducing the case
    const up = io(prog(t, 0.5, 0.85)) * (1 - io(prog(t, 2.6, 3.0))); p.armR = lerp(p.armR, -2.05, up); p.hop = 30 * Math.max(0, Math.sin(prog(t, 0.45, 0.8) * Math.PI));
  } else if (t < 7.0) {                           // pointing at the evidence, jabbing on the numbers
    p.armR = -0.6 + 0.15 * Math.sin(t * 9) * (t > 3.6 && t < 4.6 || t > 5.1 && t < 6.2 ? 1 : 0); p.armL = -0.55; p.lean = -0.04;
  } else if (t < 11.5) {                          // archive: walks in, then arms up "this much!"
    const wk = prog(t, 7.0, 8.4); p.dx = lerp(-420, 0, io(wk)); if (wk < 1) { p.legs = walkLegs(t, 26); p.bob += Math.abs(wave(t, 3)) * 14; p.lean = 0.06 * wave(t, 3); }
    const up = io(prog(t, 8.7, 9.0)); p.armL = lerp(p.armL, 1.35 + 0.15 * wave(t, 2.5), up); p.armR = lerp(p.armR, -1.35 - 0.15 * wave(t, 2.5), up); if (t > 8.7) p.hop = 20 * Math.abs(wave(t, 1.6));
  } else if (t < 14.85) {                         // roof: hand to brow, scanning the night
    const k = io(prog(t, 11.6, 12.0)); p.armR = lerp(p.armR, -2.35, k); p.lean = 0.05 * wave(t, 0.35); p.turn = 1 - 0.06 * Math.abs(wave(t, 0.35));
  } else if (t < 20.0) {                          // interrogation: slam the table, then shock
    const slam = prog(t, 15.4, 15.75); p.armL = slam < 1 ? lerp(1.2, -0.3, oC(slam)) * (t > 15.4 ? 1 : 0) : -0.3; p.armR = slam < 1 ? lerp(-1.2, 0.3, oC(slam)) * (t > 15.4 ? 1 : 0) : 0.3;
    if (t > 15.0 && t < 15.4) { p.armL = 1.2 * io(prog(t, 15.0, 15.3)); p.armR = -1.2 * io(prog(t, 15.0, 15.3)); }
    p.lean = 0.05 * Math.sin(t * 2);
    if (t > 17.85 && t < 18.5) { p.mouth = 0; p.bob = 0; }       // freeze on the flash
    if (t > 18.5 && t < 19.9) { p.surprised = true; p.mouth = 1; p.blink = false; p.hop = 90 * Math.max(0, Math.sin((t - 18.5) * 7)) * Math.exp(-(t - 18.5) * 1.3); p.armL = 1.5; p.armR = -1.5; }
  } else if (t < 23.25) {                         // vault: happy hops, waving both arms
    p.hop = 40 * Math.abs(wave(t, 1.8)); p.armL = 0.9 + 0.6 * wave(t, 1.8); p.armR = -0.9 - 0.6 * wave(t, 1.8 + 0.5); p.squash = 1 + 0.05 * wave(t, 3.6);
  } else if (t < 25.3) {                          // mugshot: stand straight, turn for the side photo, then shrug
    p.armL = -0.05; p.armR = 0.05; p.turn = 1 - 0.5 * Math.sin(prog(t, 23.9, 24.4) * Math.PI);
    if (t > 24.6) { const k = io(prog(t, 24.6, 24.8)); p.armL = lerp(p.armL, 0.9, k); p.armR = lerp(p.armR, -0.9, k); p.hop = 10 * k; }
  } else {                                        // prison: "come here" wave, then point at the viewer
    p.armR = -1.4 + 0.45 * wave(t, 2.2); p.armL = -0.2;
    if (t > 28.4) { const k = io(prog(t, 28.4, 28.6)); p.armR = lerp(p.armR, -0.9, k); p.scale = 1 + 0.05 * k; }
    p.dx = 0;
  }
  return p;
}

/* ---------- overlays timed to the voice ---------- */
function overlays(t) {
  if (t < 3.6) { stamp("КОМПРОМАТ", 540, 300, t, 1.3, 96, -0.09); T(typed("ДЕЛО № 2026 · @leonario23", t, 1.8, 26), 540, 440, { size: 44, align: "center", a: t > 3.2 ? 1 - prog(t, 3.2, 3.5) : 1 }); }
  if (t > 3.5 && t < 7.0) {
    paper(310, 360, 400, 280, -0.07, t, 3.6, (w, h) => { T("УЛИКА", -w / 2 + 34, -h / 2 + 64, { size: 36, c: "#2a2018" }); T(String(counter(73, t, 3.7, 0.9)), -w / 2 + 30, h / 2 - 36, { size: 180, w: 900, f: D, c: C.red }); });
    paper(760, 430, 400, 210, 0.06, t, 5.1, (w, h) => { T("СООБЩЕНИЙ", -w / 2 + 30, -h / 2 + 60, { size: 32, c: "#2a2018" }); T(fmt(counter(2585, t, 5.15, 1.0)), -w / 2 + 30, h / 2 - 34, { size: 92, w: 900, f: D, c: "#1c1612" }); });
  }
  if (t > 7.0 && t < 11.5) {
    paper(540, 330, 900, 280, -0.03, t, 7.1, (w, h) => { T("СЛОВ НАПИСАЛ CLAUDE", -w / 2 + 40, -h / 2 + 64, { size: 36, c: "#2a2018" }); T(fmt(counter(200586, t, 7.15, 1.4)), -w / 2 + 34, h / 2 - 40, { size: 144, w: 900, f: D, c: C.red }); });
    T(typed("≈ два с половиной романа", t, 8.6, 22), 540, 560, { size: 48, align: "center", glow: C.amber, glowR: 18 });
  }
  if (t > 11.5 && t < 14.85) {
    if (t > 12.6) T("00:00", 540, 360, { size: 150, w: 900, f: D, c: C.red, align: "center", glow: C.red, glowR: 50, s: 1 + 0.08 * Math.exp(-(t - 12.6) * 6) });
    if (t > 13.3) T(typed("НОЧНАЯ СОВА", t, 13.3, 20), 540, 460, { size: 56, ls: 6, align: "center", glow: "#7f8cff", glowR: 20 });
  }
  if (t > 14.85 && t < 20.0) {
    paper(540, 330, 700, 250, 0.04, t, 14.95, (w, h) => { T("САМЫЙ ДЛИННЫЙ ЧАТ", -w / 2 + 34, -h / 2 + 60, { size: 34, c: "#2a2018" }); T(String(counter(321, t, 16.0, 1.5)), -w / 2 + 30, h / 2 - 36, { size: 124, w: 900, f: D, c: C.red }); T("сообщ.", 60, h / 2 - 40, { size: 44, c: "#2a2018" }); });
    if (t > 17.95) {
      const p = oB(prog(t, 17.95, 18.3), 1.3); x.save(); x.translate(540, 620); x.rotate(-0.08 + (1 - p) * 0.5); x.scale(p, p);
      x.shadowColor = "rgba(0,0,0,.7)"; x.shadowBlur = 40; x.fillStyle = "#f2efe6"; x.fillRect(-330, -220, 660, 450); x.shadowColor = "transparent"; x.fillStyle = "#16121a"; x.fillRect(-300, -190, 600, 310);
      T(typed("Сценарий ролика", t, 18.05, 34), -270, -70, { size: 50 }); T(typed("с массажёром", t, 18.5, 34), -270, 0, { size: 50, c: C.orange }); T("ЧАТ № 1 ПО ДЛИНЕ", -270, 196, { size: 28, c: "#2a2018" }); x.restore();
      if (t > 18.6) T("?!", 830, 470, { size: 210, w: 900, f: D, c: C.red, rot: 0.2, s: oB(prog(t, 18.6, 18.8), 2.5), glow: C.red, glowR: 30 });
    }
  }
  if (t > 20.0 && t < 23.25) {
    T(typed("СЕКРЕТНЫЕ ДОСТИЖЕНИЯ", t, 20.05, 30), 540, 230, { size: 48, align: "center", c: C.amber, ls: 4, glow: C.amber, glowR: 20 });
    [["НОЧНОЙ КЛУБ", 20.6], ["10 ДНЕЙ ПОДРЯД", 21.0], ["МАРАФОНЕЦ · 321", 21.4]].forEach(([s, at], i) => stamp(s, 540, 370 + i * 150, t, at, 66, [-0.05, 0.04, -0.03][i], i === 1 ? C.amber : C.red));
  }
  if (t > 23.25 && t < 25.3) {
    paper(540, 1640, 760, 170, 0, t, 23.4, () => T("ИНЖЕНЕР", 0, 32, { size: 96, w: 900, f: D, c: "#16121a", align: "center" }));
    if (t > 24.6) { const names = ["КРЕАТОР", "СТРАТЕГ", "ИССЛЕДОВАТЕЛЬ", "СОБЕСЕДНИК"], k = Math.floor((t - 24.6) / 0.13) % 4; T(names[k] + "?", 540, 300, { size: 70, w: 900, f: D, c: C.amber, align: "center", glow: C.amber, glowR: 24, stroke: "#000", strokeW: 8 }); }
  }
  if (t > 25.3 && t < 29.5) {
    stamp("ТВОЙ ЧЕРЁД", 540, 280, t, 25.35, 100, -0.06);
    ["бесплатно", "2 минуты", "чаты не уходят"].forEach((s, i) => { const p = oB(prog(t, 26.4 + i * 0.45, 26.7 + i * 0.45), 2); if (p > 0) { x.save(); x.translate(540, 440 + i * 90); x.scale(p, p); x.font = `700 44px ${M}`; const w = x.measureText(s).width + 70; x.fillStyle = C.paper; x.fillRect(-w / 2, -40, w, 76); x.fillStyle = "#16121a"; x.textAlign = "center"; x.fillText(s, 0, 12); x.restore(); } });
    const pp = prog(t, 28.6, 28.85); if (pp > 0) { x.save(); x.translate(540, 1560); const s = oB(pp, 2) * (1 + 0.035 * Math.sin((t - 28.85) * 10) * (t > 28.85 ? 1 : 0)); x.scale(s, s); x.fillStyle = C.red; x.beginPath(); x.roundRect(-430, -78, 860, 156, 78); x.fill(); x.fillStyle = "#fff"; x.font = `900 52px ${D}`; x.textAlign = "center"; x.fillText("ссылка в профиле ↑", 0, 18); x.restore(); }
  }
}

/* ---------- camera ---------- */
const CAM = [[0, 1.0, 540, 980], [3.5, 1.1, 540, 1000], [7.0, 1.12, 540, 1000], [7.0, 1.0, 540, 960], [11.5, 1.12, 540, 1000], [11.5, 1.0, 540, 900], [14.85, 1.1, 540, 950],
  [14.85, 1.0, 540, 980], [17.85, 1.12, 540, 1050], [17.9, 1.42, 540, 990], [18.95, 1.42, 540, 990], [19.5, 1.08, 540, 1040], [20.0, 1.1, 540, 1000], [20.0, 1.0, 540, 980], [23.25, 1.1, 540, 1000],
  [23.25, 1.15, 540, 1080], [25.3, 1.2, 540, 1080], [25.3, 1.0, 540, 980], [28.4, 1.06, 540, 1000], [28.6, 1.16, 540, 1060], [30, 1.18, 540, 1060]];
const IMPACTS = [1.3, 3.5, 7.0, 11.5, 15.7, 17.85, 20.0, 21.4, 25.3, 28.6];
function camAt(t) {
  let i = 0; while (i < CAM.length - 2 && t >= CAM[i + 1][0]) i++; const a = CAM[i], b = CAM[i + 1], p = b[0] > a[0] ? io(prog(t, a[0], b[0])) : 1;
  let z = lerp(a[1], b[1], p), fx = lerp(a[2], b[2], p), fy = lerp(a[3], b[3], p);
  fx += Math.sin(t * 0.7) * 6 + Math.sin(t * 1.9) * 2; fy += Math.cos(t * 0.6) * 5;
  for (const im of IMPACTS) { const d = t - im; if (d >= 0 && d < 0.5) { const k = 16 * Math.exp(-d * 9); fx += Math.sin(d * 90) * k; fy += Math.cos(d * 70) * k; } }
  return { z, fx, fy };
}

/* ---------- frame ---------- */
const sceneC = document.createElement("canvas"); sceneC.width = W; sceneC.height = H; const scx = sceneC.getContext("2d");
function drawLocation(sc, t) {
  const cam = camAt(t), p = chiefPose(t);
